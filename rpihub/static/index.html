<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Simple RaspberryPi hub for other programs">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>RPi Hub</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link type="text/css" rel="stylesheet" href="/static/fonts/selawik.css">
    <link type="text/css" rel="stylesheet" href="/static/fonts/ubuntumono.css">
    <link type="text/css" rel="stylesheet" href="/static/fonts/line-awesome.min.css">
    <link type="text/css" rel="stylesheet" href="/static/css/index.css">
    <link type="text/css" rel="stylesheet" href="/static/css/index.dark.css" media="(prefers-color-scheme: dark)">
    <link type="text/css" rel="stylesheet" href="/static/css/index.mobile.css" media="only screen and (max-width: 768px)">
    <link type="text/css" rel="stylesheet" href="/static/css/index.tablet.css" media="only screen and (min-width: 769px) and (max-width: 1024px)">
    <script type="text/javascript" src="/static/js/apiresponse.js" defer></script>
    <script type="text/javascript" src="/static/js/ui.js" defer></script>
    <script type="text/javascript" src="/static/js/languagebase.js" defer></script>
    <script type="text/javascript" src="/static/js/application.js" defer></script>
    <script type="text/javascript" src="/static/js/debug.js" defer></script>
    <script type="text/javascript" src="/static/js/api.js" defer></script>
    <script type="text/javascript" src="/static/js/index.js" defer></script>
</head>
<body>
    <section id="title">
        <h1>
            <a href="/">
                <img src="/static/rpihub.png" alt="RPi Hub logo">
                RPi Hub
            </a>
        </h1>
        <div class='loader'>
            <div class="bg"></div>
            <div class='circle'></div>
            <div class='circle'></div>
            <div class='circle'></div>
            <div class='circle'></div>
            <div class='circle'></div>
        </div>
    </section>
    <main class="hidden">
        <h1>
            <a href="/">
                <img src="/static/rpihub.png" alt="RPi Hub logo">
            </a>
        </h1>
        <section>
            <h2>
                <span data-phrase="welcome">Welcome</span>
                <span id="language-switcher" aria-label="Language"></span>
            </h2>
            <p>
                <span data-phrase="today_is">Today is</span>
                <span id="today"></span>.
            </p>
            <article>
                <div id="apps-placeholder">
                    <div class='loader'>
                        <div class="bg"></div>
                        <div class='circle'></div>
                        <div class='circle'></div>
                        <div class='circle'></div>
                        <div class='circle'></div>
                        <div class='circle'></div>
                    </div>
                <i data-phrase="loading_apps">Loading applications...</i>
                </div>
                <div id="apps" class="hidden">
                </div>
            </article>
        </section>
    </main>
    <section class="dialogs">
        
    </section>
    <template id="dialog-template">
        <article class="dialog">
            <aside>
            </aside>
            <div class="dialog-content">
                <h1>Header</h1>
                <p>Message</p>
                <ul>
                </ul>                
                <div class="details hidden">
                    <p>Details</p>
                </div>
            </div>
        </article>
    </template>
    <script type="text/javascript">
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js"));
        }
    </script>
</body>
</html>
